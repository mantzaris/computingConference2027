<svg xmlns="http://www.w3.org/2000/svg" width="560pt" height="455pt" viewBox="0 0 560 455"><style>text{font-family:Helvetica,Arial,sans-serif;fill:#203744}.edge{fill:none;stroke-width:1.1}</style><style>.t0{font-size:14px;fill:#203744;text-anchor:middle;font-weight:bold}.t1{font-size:12px;fill:#203744;text-anchor:middle;}.t2{font-size:10.5px;fill:#203744;text-anchor:start;}.t3{font-size:11px;fill:#203744;text-anchor:start;font-weight:bold}.t4{font-size:10px;fill:#203744;text-anchor:start;}.t5{font-size:12px;fill:#a64c43;text-anchor:start;font-weight:bold}.t6{font-size:12px;fill:#247b77;text-anchor:start;font-weight:bold}.t7{font-size:9px;fill:#203744;text-anchor:middle;}</style><rect width="100%" height="100%" fill="white"/><text x="280.0" y="22.0" class="t0">15 | The northern campaign against Bolton rule</text><text x="280.0" y="41.0" class="t1">What changes under the declared alternatives?</text><text x="20.0" y="62.0" class="t2">The Stark-led coalition takes Winterfell and ends Ramsay Bolton&#x27;s control by the end of</text><text x="20.0" y="75.5" class="t2">S06E09.</text><text x="20.0" y="98.0" class="t3">Observed outcome: YES. Scenario answers below are conditional.</text><text x="20.0" y="122.0" class="t4">Selected question</text><text x="294.0" y="122.0" class="t4">Partial family</text><text x="390.0" y="122.0" class="t4">Scenario A</text><text x="490.0" y="122.0" class="t4">Scenario B</text><rect x="15.0" y="133.0" width="530.0" height="60.0" rx="5" fill="#f5f8fa" stroke="#d9e0e5"/><text x="22.0" y="143.0" class="t2">Without timely Vale relief, do the Starks</text><text x="22.0" y="156.5" class="t2">take Winterfell?</text><text x="294.0" y="161.0" class="t3">Unknown</text><text x="390.0" y="161.0" class="t5">No</text><text x="490.0" y="161.0" class="t5">No</text><rect x="15.0" y="198.0" width="530.0" height="60.0" rx="5" fill="#f5f8fa" stroke="#d9e0e5"/><text x="22.0" y="208.0" class="t2">If Ramsay does not use Rickon as bait, do</text><text x="22.0" y="221.5" class="t2">the Starks still take Winterfell?</text><text x="294.0" y="226.0" class="t3">Unknown</text><text x="390.0" y="226.0" class="t6">Yes</text><text x="490.0" y="226.0" class="t6">Yes</text><rect x="15.0" y="263.0" width="530.0" height="60.0" rx="5" fill="#f5f8fa" stroke="#d9e0e5"/><text x="22.0" y="273.0" class="t2">Without both Rickon&#x27;s bait and timely Vale</text><text x="22.0" y="286.5" class="t2">relief, do the Starks take Winterfell?</text><text x="294.0" y="291.0" class="t3">Unknown</text><text x="390.0" y="291.0" class="t5">No</text><text x="490.0" y="291.0" class="t6">Yes</text><text x="20.0" y="347.0" class="t4">A: Relief and a field force are required for pursuit; a persistent enclosure blocks it.</text><text x="20.0" y="389.0" class="t4">B: A field force can pursue whenever not enclosed, including an assumed successful advance</text><text x="20.0" y="402.0" class="t4">after avoiding the trap without relief.</text><text x="280.0" y="443.0" class="t7">Same mechanisms/background reused; no probabilities or natural counterfactual gold.</text></svg>