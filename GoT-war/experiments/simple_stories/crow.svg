"5" fill="#fff2d9" stroke="#587482"/><text x="217.2" y="96.9" class="t4">Enough stones</text><text x="217.2" y="112.8" class="t4">available</text><text x="217.2" y="128.7" class="t4">S = 1</text><rect x="270.3" y="282.2" width="88.2" height="49.6" rx="5" fill="#f8e8e6" stroke="#587482"/><text x="314.4" y="295.1" class="t4">Water initially</text><text x="314.4" y="311.0" class="t4">reachable</text><text x="314.4" y="326.9" class="t4">B = 0</text><rect x="146.9" y="190.0" width="140.7" height="35.7" rx="5" fill="#f0f5f7" stroke="#587482"/><text x="217.2" y="203.9" class="t4">Enough stones added</text><text x="217.2" y="219.8" class="t4">A = 1</text><rect x="167.2" y="289.2" width="76.3" height="35.7" rx="5" fill="#f0f5f7" stroke="#587482"/><text x="205.3" y="303.1" class="t4">Water rises</text><text x="205.3" y="318.9" class="t4">R = 1</text><rect x="118.6" y="401.1" width="135.8" height="35.7" rx="5" fill="#f0f5f7" stroke="#587482"/><text x="186.5" y="415.0" class="t4">Water now reachable</text><text x="186.5" y="430.9" class="t4">T = 1</text><rect x="145.9" y="493.3" width="81.3" height="35.7" rx="5" fill="#e0eeec" stroke="#587482"/><text x="186.5" y="507.2" class="t4">Crow drinks</text><text x="186.5" y="523.1" class="t4">D = 1</text><rect x="432.0" y="84.0" width="168.0" height="445.0" rx="5" fill="#f6f8fa" stroke="#d9e1e6"/><text x="444.0" y="106.0" class="t5">Assumed rules</text><text x="444.0" y="126.0" class="t6">Added sentences define</text><text x="444.0" y="139.5" class="t6">these exact functions.</text><text x="444.0" y="165.0" class="t7">A = S</text><text x="444.0" y="181.0" class="t8">S3</text><text x="444.0" y="213.0" class="t7">R = I &amp; A</text><text x="444.0" y="229.0" class="t8">S4</text><text x="444.0" y="261.0" class="t7">T = I &amp; (B | R)</text><text x="444.0" y="277.0" class="t8">S5</text><text x="444.0" y="309.0" class="t7">D = T</text><text x="444.0" y="325.0" class="t8">S6</text><text x="444.0" y="360.0" class="t6">&amp; together   | either</text><text x="444.0" y="373.5" class="t6">! absence / negation</text><text x="444.0" y="387.0" class="t6">0 absent   1 present</text><text x="444.0" y="414.0" class="t9">Amber: boundary input</text><text x="444.0" y="426.5" class="t9">Pink: factual value 0</text><text x="444.0" y="439.0" class="t9">Teal: endpoint outcome</text><rect x="12.0" y="542.0" width="588.0" height="119.0" rx="5" fill="#edf4f5" stroke="#bad1d3"/><text x="25.0" y="561.0" class="t5">How the factors work together</text><text x="25.0" y="580.0" class="t10">An intact pitcher and added stones raise the water. With the pitcher intact, initial</text><text x="25.0" y="594.5" class="t10">reachability and raised water are alternative routes to drinking.</text><text x="25.0" y="625.0" class="t6">Enough stones are not universally necessary: water already within reach permits drinking without</text><text x="25.0" y="638.5" class="t6">them. Sufficient water and readiness to drink stay fixed.</text><text x="16.0" y="685.0" class="t11">Natural version: this successful sequence does not identify what happens with a leaking pitcher.</text><text x="16.0" y="729.0" class="t9">Sentence references point to frozen.json. Rules are author assumptions, not claims about every telling.</text><text x="16.0" y="744.0" class="t9">Exact reference execution: four frozen questions checked. Generator failures remain in the comparison table.</text></svg>