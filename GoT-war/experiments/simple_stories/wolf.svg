.0 204.5 224.5" stroke="#377b7b"/><polygon points="204.3,229.5 202.0,224.5 207.0,224.6" fill="#377b7b"/><text x="249.5" y="195.0" class="t3">Real threat</text><text x="249.5" y="209.5" class="t3">prompts warning</text><text x="249.5" y="224.0" class="t3">S4</text><path class="edge" d="M281.0 178.3C287.0 183.3 291.5 187.0 291.5 187.0C291.5 187.0 291.5 440.0 291.5 440.0C291.5 440.0 289.6 441.3 286.7 443.2" stroke="#377b7b"/><polygon points="282.5,446.0 285.3,441.1 288.1,445.3" fill="#377b7b"/><text x="329.0" y="302.0" class="t3">Wolf threatens</text><text x="329.0" y="316.5" class="t3">the flock</text><text x="329.0" y="331.0" class="t3">S6</text><path class="edge" d="M203.7 285.1C203.9 298.9 204.0 316.4 204.2 331.6" stroke="#377b7b"/><polygon points="204.2,336.6 201.7,331.6 206.7,331.6" fill="#377b7b"/><text x="245.5" y="302.0" class="t3">Warning calls</text><text x="245.5" y="316.5" class="t3">villagers to help</text><text x="245.5" y="331.0" class="t3">S5</text><path class="edge" d="M208.9 392.4C212.7 413.3 217.5 440.0 217.5 440.0C217.5 440.0 218.8 441.0 221.0 442.6" stroke="#377b7b"/><polygon points="225.0,445.6 219.5,444.6 222.5,440.6" fill="#377b7b"/><text x="255.5" y="409.0" class="t3">Timely help</text><text x="255.5" y="423.5" class="t3">prevents harm</text><text x="255.5" y="438.0" class="t3">S6</text><rect x="66.5" y="128.0" width="82.0" height="50.0" rx="5" fill="#fff2d9" stroke="#587482"/><text x="107.5" y="141.0" class="t4">Earlier false</text><text x="107.5" y="157.0" class="t4">alarms</text><text x="107.5" y="173.0" class="t4">F = 1</text><rect x="68.0" y="235.0" width="79.0" height="50.0" rx="5" fill="#f0f5f7" stroke="#587482"/><text x="107.5" y="248.0" class="t4">Villagers</text><text x="107.5" y="264.0" class="t4">distrust him</text><text x="107.5" y="280.0" class="t4">L = 1</text><rect x="218.5" y="128.0" width="66.0" height="50.0" rx="5" fill="#fff2d9" stroke="#587482"/><text x="251.5" y="141.0" class="t4">Real wolf</text><text x="251.5" y="157.0" class="t4">appears</text><text x="251.5" y="173.0" class="t4">W = 1</text><rect x="159.0" y="235.0" width="89.0" height="50.0" rx="5" fill="#f0f5f7" stroke="#587482"/><text x="203.5" y="248.0" class="t4">New warning</text><text x="203.5" y="264.0" class="t4">given</text><text x="203.5" y="280.0" class="t4">N = 1</text><rect x="153.5" y="342.0" width="102.0" height="50.0" rx="5" fill="#f8e8e6" stroke="#587482"/><text x="204.5" y="355.0" class="t4">Villagers</text><text x="204.5" y="371.0" class="t4">respond in time</text><text x="204.5" y="387.0" class="t4">V = 0</text><rect x="200.0" y="449.0" width="105.0" height="36.0" rx="5" fill="#e0eeec" stroke="#587482"/><text x="252.5" y="463.0" class="t4">Flock is harmed</text><text x="252.5" y="479.0" class="t4">H = 1</text><rect x="432.0" y="84.0" width="168.0" height="445.0" rx="5" fill="#f6f8fa" stroke="#d9e1e6"/><text x="444.0" y="106.0" class="t5">Assumed rules</text><text x="444.0" y="126.0" class="t6">Added sentences define</text><text x="444.0" y="139.5" class="t6">these exact functions.</text><text x="444.0" y="165.0" class="t7">L = F</text><text x="444.0" y="181.0" class="t8">S3</text><text x="444.0" y="213.0" class="t7">N = W</text><text x="444.0" y="229.0" class="t8">S4</text><text x="444.0" y="261.0" class="t7">V = N &amp; !L</text><text x="444.0" y="277.0" class="t8">S5</text><text x="444.0" y="309.0" class="t7">H = W &amp; !V</text><text x="444.0" y="325.0" class="t8">S6</text><text x="444.0" y="360.0" class="t6">&amp; together   | either</text><text x="444.0" y="373.5" class="t6">! absence / negation</text><text x="444.0" y="387.0" class="t6">0 absent   1 present</text><text x="444.0" y="414.0" class="t9">Amber: boundary input</text><text x="444.0" y="426.5" class="t9">Pink: factual value 0</text><text x="444.0" y="439.0" class="t9">Teal: endpoint outcome</text><rect x="12.0" y="542.0" width="588.0" height="119.0" rx="5" fill="#edf4f5" stroke="#bad1d3"/><text x="25.0" y="561.0" class="t5">How the factors work together</text><text x="25.0" y="580.0" class="t10">A new warning and retained trust are jointly required for timely response. A real wolf</text><text x="25.0" y="594.5" class="t10">harms the flock only without that response.</text><text x="25.0" y="625.0" class="t6">Restoring credibility helps only if the new warning is still given. Removing the warning alone</text><text x="25.0" y="638.5" class="t6">leaves the factual harm unchanged.</text><text x="16.0" y="685.0" class="t11">Natural version: the text leaves timing and the protective effect of hypothetical help unresolved.</text><text x="16.0" y="729.0" class="t9">Sentence references point to frozen.json. Rules are author assumptions, not claims about every telling.</text><text x="16.0" y="744.0" class="t9">Exact reference execution: four frozen questions checked. Generator failures remain in the comparison table.</text></svg>