">A = 1</text><rect x="281.0" y="240.5" width="110.0" height="50.0" rx="5" fill="#f8e8e6" stroke="#587482"/><text x="336.0" y="253.5" class="t4">Effective method</text><text x="336.0" y="269.5" class="t4">available</text><text x="336.0" y="285.5" class="t4">E = 0</text><rect x="170.5" y="349.0" width="111.0" height="36.0" rx="5" fill="#f8e8e6" stroke="#587482"/><text x="226.0" y="363.0" class="t4">Repair succeeds</text><text x="226.0" y="379.0" class="t4">R = 0</text><rect x="20.0" y="443.5" width="122.0" height="36.0" rx="5" fill="#e0eeec" stroke="#587482"/><text x="81.0" y="457.5" class="t4">Remains damaged</text><text x="81.0" y="473.5" class="t4">Y = 1</text><rect x="432.0" y="84.0" width="168.0" height="445.0" rx="5" fill="#f6f8fa" stroke="#d9e1e6"/><text x="444.0" y="106.0" class="t5">Assumed rules</text><text x="444.0" y="126.0" class="t6">Added sentences define</text><text x="444.0" y="139.5" class="t6">these exact functions.</text><text x="444.0" y="165.0" class="t7">D = F</text><text x="444.0" y="181.0" class="t8">S4</text><text x="444.0" y="213.0" class="t7">R = D &amp; A &amp; E</text><text x="444.0" y="229.0" class="t8">S5</text><text x="444.0" y="261.0" class="t7">Y = D &amp; !R</text><text x="444.0" y="277.0" class="t8">S6</text><text x="444.0" y="312.0" class="t6">&amp; together   | either</text><text x="444.0" y="325.5" class="t6">! absence / negation</text><text x="444.0" y="339.0" class="t6">0 absent   1 present</text><text x="444.0" y="366.0" class="t9">Amber: boundary input</text><text x="444.0" y="378.5" class="t9">Pink: factual value 0</text><text x="444.0" y="391.0" class="t9">Teal: endpoint outcome</text><rect x="12.0" y="542.0" width="588.0" height="119.0" rx="5" fill="#edf4f5" stroke="#bad1d3"/><text x="25.0" y="561.0" class="t5">How the factors work together</text><text x="25.0" y="580.0" class="t10">Repair succeeds only with damage, an attempt, and an effective method together. Remaining</text><text x="25.0" y="594.5" class="t10">damage requires initial damage and no successful repair.</text><text x="25.0" y="625.0" class="t6">Failed help does not mean all repair is impossible. An available effective method changes the</text><text x="25.0" y="638.5" class="t6">outcome only when repair is attempted.</text><text x="16.0" y="685.0" class="t11">Natural version: a different repair remains untested; permanent irreparability is not established.</text><text x="16.0" y="729.0" class="t9">Sentence references point to frozen.json. Rules are author assumptions, not claims about every telling.</text><text x="16.0" y="744.0" class="t9">Exact reference execution: four frozen questions checked. Generator failures remain in the comparison table.</text></svg>