[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "got-war"
version = "0.1.0"
description = "Auditable generated structural programs and shared-path attribution"
requires-python = ">=3.8"
dependencies = ["numpy>=1.22", "networkx>=3.0", "requests>=2.28", "beautifulsoup4>=4.8", "matplotlib>=3.1"]

[project.scripts]
got-war = "got_war.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".cache/pytest_cache"
